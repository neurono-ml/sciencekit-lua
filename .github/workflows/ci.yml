name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build the native module and run the Lua suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.85 toolchain
        uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy
      - name: Install Lua 5.4
        # The module embeds Lua 5.4 (mlua `lua54` + `vendored`); this installs a
        # system interpreter to run `tests/run.lua` against the built module. The
        # source is compiled directly, so the job needs no package index.
        run: |
          curl -fsSL --retry 3 -o lua.tar.gz \
            https://codeload.github.com/lua/lua/tar.gz/refs/tags/v5.4.8
          tar xzf lua.tar.gz
          cd lua-5.4.8
          gcc -O2 -std=gnu99 -DLUA_USE_LINUX -o lua \
            $(ls *.c | grep -v -E '^(luac|onelua)\.c$') -Wl,-E -ldl -lm
          mkdir -p "$HOME/.local/bin"
          install -m 0755 lua "$HOME/.local/bin/lua5.4"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/lua5.4" -v
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check the lockfile is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Formatting (cargo fmt)
        run: cargo fmt --all --check
      - name: Static analysis (cargo clippy)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build the native module
        run: cargo build --release
      - name: Run the Rust test suite
        run: cargo test
      - name: Run the Lua suite
        env:
          SCIENCEKIT_LUA_LIB: ${{ github.workspace }}/target/release/libsciencekit_lua.so
        run: lua5.4 tests/run.lua
