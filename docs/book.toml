[book]
title = "sciencekit for Lua"
description = "Lua 5.4 bindings for the sciencekit machine-learning library — embedded Lua 5.4 over the stable C ABI."
authors = ["sciencekit project"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
theme = "theme"
default-theme = "coal"
preferred-dark-theme = "coal"
additional-css = ["theme/custom.css"]
additional-js = ["theme/custom.js"]
git-repository-url = "https://github.com/neurono-ml/sciencekit-lua"
edit-url-template = "https://github.com/neurono-ml/sciencekit-lua/edit/docs/documentations/docs/src/{path}"
site-url = "/sciencekit-lua/"
no-section-label = true

[output.html.search]
enable = true
boost-title = 2

[output.html.playground]
editable = false
line-numbers = true
copyable = true
